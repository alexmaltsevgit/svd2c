[package]
name = "svd2c"
version = "0.1.5"
edition = "2024"

[dependencies]
quick-xml = "0.41.0"
strfmt = "0.2.5"

[[bin]]
name = "svd2c"
path = "src/main.rs"

[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"

[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"
