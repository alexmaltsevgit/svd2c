name: Build and Publish SVD2C

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: svd2c
          - name: win32-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: svd2c.exe
          - name: darwin-x64
            os: macos-latest
            target: x86_64-apple-darwin
            bin: svd2c
          - name: darwin-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            bin: svd2c

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        run: rustup target add ${{ matrix.target }}

      - name: Build binary
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.name }}
          path: target/${{ matrix.target }}/release/${{ matrix.bin }}

  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Move binaries to packages
        run: |
          mkdir -p npm/packages/linux-x64/bin
          mkdir -p npm/packages/win32-x64/bin
          mkdir -p npm/packages/darwin-x64/bin
          mkdir -p npm/packages/darwin-arm64/bin

          cp artifacts/bin-linux-x64/svd2c npm/packages/linux-x64/bin/
          cp artifacts/bin-win32-x64/svd2c.exe npm/packages/win32-x64/bin/
          cp artifacts/bin-darwin-x64/svd2c npm/packages/darwin-x64/bin/
          cp artifacts/bin-darwin-arm64/svd2c npm/packages/darwin-arm64/bin/

          chmod +x npm/packages/*/bin/svd2c*

      - name: Publish Platform Packages
        run: |
          for dir in npm/packages/*/; do
            echo "Publishing $dir..."
            (cd "$dir" && npm publish --access public --provenance)
          done

      - name: Publish CLI Package
        run: |
          cd npm/cli
          npm publish --access public --provenance
